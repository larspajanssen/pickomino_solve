[project]
name = "pickomino-solver"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.1",
    "pydantic>=2.11.7",
    "uvicorn>=0.35.0",
    "websockets>=14.2",
]

[dependency-groups]
test = [
    "pytest>=8.4.1",
    "httpx>=0.27.0",
]

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["pickomino_solver*"]

[tool.ruff.lint]
extend-select = ["I"]
