[project]
name = "pickomino-solver"
version = "0.2.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.1",
    "pydantic>=2.11.7",
    "uvicorn>=0.35.0",
    "websockets>=14.2",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "maturin>=1.13.3",
    "pytest>=9.0.3",
]

[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[tool.ruff.lint]
extend-select = ["I"]

[tool.maturin]
manifest-path = "../solver/Cargo.toml"
module-name = "pickomino_solver"
python-source = "src"
