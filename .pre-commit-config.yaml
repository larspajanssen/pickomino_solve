repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        files: \.(js|ts|jsx|tsx|css|less|html|json|markdown|md|yaml|yml)$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/kynan/nbstripout
    rev: 0.8.1
    hooks:
      - id: nbstripout

  - repo: local
    hooks:
      - id: rust-check
        name: rust-check
        entry: cargo
        args: ["check", "--manifest-path", "solver/Cargo.toml"]
        language: system
        pass_filenames: false
      - id: rust-test
        name: rust-test
        entry: cargo
        args: ["test", "--manifest-path", "solver/Cargo.toml"]
        language: system
        pass_filenames: false
      - id: python-compile-and-test
        name: python-compile-and-test
        entry: uv
        args: ["--project", "api", "run", "--no-cache", "pytest"]
        language: system
        pass_filenames: false
