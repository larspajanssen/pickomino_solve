name: prek

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: prek-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Python tooling
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pre-commit
            ~/.cache/uv
            ~/.local/bin
            ~/.local/share/uv
          key: prek-python-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml', 'api/pyproject.toml', 'api/uv.lock') }}
          restore-keys: |
            prek-python-${{ runner.os }}-

      - name: Cache Rust tooling
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            solver/target
          key: prek-rust-${{ runner.os }}-${{ hashFiles('solver/Cargo.toml', 'solver/Cargo.lock') }}
          restore-keys: |
            prek-rust-${{ runner.os }}-

      - name: Install prek
        run: uv tool install prek

      - name: Run prek
        run: prek run --all-files --show-diff-on-failure --color=always
