name: Docker

on:
  release:
    types: [published]
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      docker_tag:
        description: Tag to build (for example, v1.1.1)
        required: true
        type: string
      publish_latest:
        description: Also update the latest tag
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  publish:
    if: >-
      github.event_name == 'release' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       startsWith(github.event.pull_request.head.ref, 'release-please--'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.event.release.tag_name || inputs.docker_tag }}

      - name: Read release version
        id: version
        run: echo "version=$(node -p \"require('./frontend/package.json').version\")" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: larspajanssen/pickomino
          tags: |
            type=raw,value=${{ github.event.release.tag_name || inputs.docker_tag || format('v{0}', steps.version.outputs.version) }}
            type=raw,value=latest,enable=${{ github.event_name != 'workflow_dispatch' || inputs.publish_latest }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
