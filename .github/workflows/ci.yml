name: CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "solver/**"
      - "wasm/**"
      - "frontend/**"
      - "assets/**"
      - "Dockerfile"
      - ".pre-commit-config.yaml"
      - ".github/workflows/ci.yml"
      - "README.md"

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    concurrency:
      group: build-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Rust build and tooling
        id: rust-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/git
            ~/.cargo/registry
            target
          key: ci-rust-${{ runner.os }}-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}
          restore-keys: |
            ci-rust-${{ runner.os }}-

      - name: Install wasm-bindgen
        if: steps.rust-cache.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version 0.2.105

      - name: Test Rust workspace
        run: cargo test --locked

      - name: Build WASM bindings
        run: |
          cargo build --locked --release --target wasm32-unknown-unknown -p pickomino-wasm
          wasm-bindgen target/wasm32-unknown-unknown/release/pickomino_wasm.wasm --target web --out-dir wasm/pkg

      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run typecheck && npm test && npm run build

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: pickomino:ci
          cache-from: type=gha,scope=ci
          cache-to: type=gha,mode=max,scope=ci

  pre-commit:
    if: github.event_name != 'pull_request' || github.base_ref == 'main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    concurrency:
      group: prek-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust tooling
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            target
          key: prek-rust-${{ runner.os }}-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}
          restore-keys: |
            prek-rust-${{ runner.os }}-

      - name: Install prek
        run: uv tool install prek

      - name: Run prek
        run: prek run --all-files --color=always
        continue-on-error: true

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-fix formatting with prek"
