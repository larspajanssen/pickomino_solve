<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pickomino Solver</title>
    <link rel="stylesheet" href="style.css?v=3" />
  </head>

  <body>
    <div class="container">
      <h1>Pickomino Solver</h1>

      <form id="game-form">
        <!-- Dice Selection Panel -->
        <div class="section">
          <h2>Add Dice</h2>
          <div class="dice-controls">
            <button
              type="button"
              class="die-btn"
              onclick="addDieToFocus(1)"
              aria-label="Add 1"
            >
              <div class="die-face">
                <div class="dot" style="grid-column: 2; grid-row: 2"></div>
              </div>
            </button>
            <button
              type="button"
              class="die-btn"
              onclick="addDieToFocus(2)"
              aria-label="Add 2"
            >
              <div class="die-face">
                <div class="dot" style="grid-column: 1; grid-row: 3"></div>
                <div class="dot" style="grid-column: 3; grid-row: 1"></div>
              </div>
            </button>
            <button
              type="button"
              class="die-btn"
              onclick="addDieToFocus(3)"
              aria-label="Add 3"
            >
              <div class="die-face">
                <div class="dot" style="grid-column: 1; grid-row: 3"></div>
                <div class="dot" style="grid-column: 2; grid-row: 2"></div>
                <div class="dot" style="grid-column: 3; grid-row: 1"></div>
              </div>
            </button>
            <button
              type="button"
              class="die-btn"
              onclick="addDieToFocus(4)"
              aria-label="Add 4"
            >
              <div class="die-face">
                <div class="dot" style="grid-column: 1; grid-row: 1"></div>
                <div class="dot" style="grid-column: 3; grid-row: 1"></div>
                <div class="dot" style="grid-column: 1; grid-row: 3"></div>
                <div class="dot" style="grid-column: 3; grid-row: 3"></div>
              </div>
            </button>
            <button
              type="button"
              class="die-btn"
              onclick="addDieToFocus(5)"
              aria-label="Add 5"
            >
              <div class="die-face">
                <div class="dot" style="grid-column: 1; grid-row: 1"></div>
                <div class="dot" style="grid-column: 3; grid-row: 1"></div>
                <div class="dot" style="grid-column: 2; grid-row: 2"></div>
                <div class="dot" style="grid-column: 1; grid-row: 3"></div>
                <div class="dot" style="grid-column: 3; grid-row: 3"></div>
              </div>
            </button>
            <button
              type="button"
              class="die-btn"
              onclick="addDieToFocus(6)"
              aria-label="Add Worm"
            >
              <div class="worm-face">🪱</div>
            </button>
          </div>
        </div>

        <!-- Available Tiles -->
        <div class="section">
          <div class="pool-label-row">
            <h2>Available Tiles</h2>
            <div class="action-buttons" style="margin-top: 0">
              <button
                type="button"
                class="btn-secondary"
                onclick="toggleAllTiles(true)"
              >
                Select All
              </button>
              <button
                type="button"
                class="btn-secondary"
                onclick="toggleAllTiles(false)"
              >
                Clear All
              </button>
            </div>
          </div>
          <div id="tiles-pool" class="tiles-grid"></div>
        </div>

        <!-- Hand State -->
        <div class="section">
          <div class="pool-label-row">
            <h2>Current Hand</h2>
            <span id="hand-count" class="count-badge">0/8</span>
          </div>
          <!-- Hidden input for form submission logic compatibility if needed later -->
          <input type="hidden" id="hand" name="hand" />

          <div id="hand-pool" class="dice-pool" onclick="setFocus('hand')">
            <span
              style="
                color: grey;
                font-style: italic;
                font-size: 0.9em;
                width: 100%;
                text-align: center;
              "
              id="hand-placeholder"
              >Click dice above to add to Hand</span
            >
          </div>
          <div class="action-buttons">
            <button
              type="button"
              class="btn-secondary"
              onclick="clearPool('hand')"
            >
              Clear Hand
            </button>
            <button
              type="button"
              class="btn-secondary"
              onclick="setFocus('hand')"
            >
              Select Hand
            </button>
          </div>
        </div>

        <!-- Dice Throw State -->
        <div class="section">
          <div class="pool-label-row">
            <h2>Current Throw</h2>
            <span id="throw-count" class="count-badge">0/8</span>
          </div>
          <input type="hidden" id="dice_throw" name="dice_throw" />

          <div id="throw-pool" class="dice-pool" onclick="setFocus('throw')">
            <span
              style="
                color: grey;
                font-style: italic;
                font-size: 0.9em;
                width: 100%;
                text-align: center;
              "
              id="throw-placeholder"
              >Click dice above to add to Throw</span
            >
          </div>
          <div class="action-buttons">
            <button
              type="button"
              class="btn-secondary"
              onclick="clearPool('throw')"
            >
              Clear Throw
            </button>
            <button
              type="button"
              class="btn-secondary"
              onclick="setFocus('throw')"
            >
              Select Throw
            </button>
          </div>
        </div>

        <div class="error-msg" id="validation-error"></div>

        <div class="form-actions">
          <button type="submit" id="submit-btn" class="cta-button">
            Compute best action
          </button>
        </div>
      </form>

      <div id="results" style="display: none">
        <div class="section">
          <h2>Results</h2>
          <table id="results-table">
            <thead>
              <tr>
                <th>Action</th>
                <th>Expected Value</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>
    <script src="api.js?v=3"></script>
    <script src="app.js?v=3"></script>
  </body>
</html>
